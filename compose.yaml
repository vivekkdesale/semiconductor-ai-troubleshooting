name: semiconductor-ai

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: semiconductor
      POSTGRES_USER: semiconductor
      POSTGRES_PASSWORD: semiconductor
    ports: ["5432:5432"]
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semiconductor -d semiconductor"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/semiconductor-graph
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
    depends_on:
      timescaledb: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    command: ["sh", "-c", "alembic upgrade head && uvicorn semiconductor.main:app --host 0.0.0.0 --port 8000"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      timescaledb: {condition: service_healthy}

volumes:
  timescale-data:
  neo4j-data:
  qdrant-data:
  grafana-data:
