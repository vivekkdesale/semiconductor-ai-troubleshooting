[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semiconductor-troubleshooting"
version = "0.1.0"
description = "Phase 1 foundation for an industrial AI semiconductor troubleshooting platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "neo4j>=5.25,<6",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "qdrant-client>=1.12,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
semiconductor-api = "semiconductor.main:run"
secom-ingest = "semiconductor.adapters.secom:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semiconductor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency injection uses calls in defaults by design.
